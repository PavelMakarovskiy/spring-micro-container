databaseChangeLog:
  - changeSet:
      id: create-account
      author: Pavel
      changes:
        - createTable:
            tableName: account
            columns:
              - column:
                  name: id
                  type: varchar(25)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: currency
                  type: varchar(5)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: bigint
                  constraints:
                    nullable: false
        - createTable:
            tableName: transfer
            columns:
              - column:
                  name: id
                  type: varchar(50)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: currency
                  type: varchar(5)
                  constraints:
                    nullable: false
              - column:
                  name: payment
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: sender_id
                  type: varchar(50)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sender_id
                    references: account(id)
              - column:
                  name: recipient_id
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: purpose
                  type: varchar(200)




