spring:
  liquibase:
    enabled: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/fin
    username: fin
    password: fin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: russian-payment-system
  config:
    import: configserver:http://localhost:8888
  profiles:
    active: micro
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: rus-ps-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: net.pay.russian_payment_system.serialization.TransferDeserializer
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: net.pay.russian_payment_system.serialization.TransferSerializer
mybatis:
  type-handlers-package: net.pay.russian_payment_system.mapper

app:
  cache:
    size: 365

cbr:
  url: "http://cbr.ru/scripts/XML_daily.asp"

